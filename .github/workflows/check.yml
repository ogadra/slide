name: Check

on:
  pull_request:

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Nothing here runs a browser or a bundler, so the postinstall scripts —
      # the Chromium download above all — are dead weight.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm --filter slide-home run lint

      - name: Typecheck scripts
        run: pnpm run typecheck

      # Only the key names reach the generated types, so the sample is enough.
      - name: Provide the .dev.vars keys
        run: cp .dev.vars.sample .dev.vars

      # Generates the gitignored manifest and Worker types first.
      - name: Typecheck the homepage
        run: pnpm --filter slide-home run typecheck
