name: Check

on:
  pull_request:

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Nothing here runs a browser or a bundler, so the postinstall scripts —
      # the Chromium download above all — are dead weight.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm --filter slide-home run lint

      - name: Typecheck scripts
        run: pnpm run typecheck

      # Only the key names reach the generated types, so the sample is enough.
      - name: Provide the .dev.vars keys
        run: cp .dev.vars.sample .dev.vars

      # Generates the gitignored manifest and Worker types first.
      - name: Typecheck the homepage
        run: pnpm --filter slide-home run typecheck

  # Its own job so a type error and a failing test show up as two findings, not one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Keeps its scripts for workerd, skips Chromium, which only the PNG export needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The Worker imports the generated manifest, so `test` generates it first.
      - name: Test
        run: pnpm run test

  # Nothing built a deck on a pull request, so slidev and vite bumps only failed in Deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Same two steps as Deploy, so this job fails on whatever would fail there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The Worker bundle imports the manifest.
      - name: Generate the slide manifest
        run: pnpm run generate

      # Every deck, because a bump reaches every deck. All 21 build in under 20 seconds.
      - name: Build every deck
        run: pnpm -r --workspace-concurrency=2 run build:slidev

      # The expensive half and its own failure mode, so the smallest deck runs it.
      - name: Export one deck to PNG
        run: pnpm --filter terraform-github-management run build:png

      # What Deploy ships, bundled for real and without credentials.
      - name: Bundle the Worker
        run: pnpm exec wrangler deploy --dry-run --env=""

  # Everything above checks a part. This one opens the assembled site in a browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # wrangler dev reads this, and the Worker refuses to start without the keys.
      - name: Provide the .dev.vars keys
        run: cp .dev.vars.sample .dev.vars

      # Builds the newest deck, seeds it into the local R2, then drives wrangler dev.
      - name: End to end
        run: pnpm run e2e

  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install rclone
        run: |
          version=v1.75.0
          sha256=aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
          archive="rclone-${version}-linux-amd64"
          curl -fsSL -o "${archive}.zip" "https://downloads.rclone.org/${version}/${archive}.zip"
          sha256sum -c - <<<"${sha256}  ${archive}.zip"
          unzip -q "${archive}.zip"
          sudo install -m 755 "${archive}/rclone" /usr/local/bin/rclone
          rm -r "${archive}" "${archive}.zip"
          rclone version | head -1

      - name: Download the deployed slides
        env:
          RCLONE_S3_PROVIDER: Cloudflare
          RCLONE_S3_REGION: auto
          RCLONE_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_VRT }}
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_VRT }}
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: rclone copy :s3:slide-decks/slides vrt-baseline/slides --include '*/slides-export/*.png'

      - name: Export the decks this pull request leaves alone
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          filters=$(git diff --name-only "$BASE_SHA" HEAD -- slidev | grep -vE '/(package\.json|pnpm-lock\.yaml)$' | cut -d/ -f2 | sort -u | sed 's/^/--filter=!/' | tr '\n' ' ')
          echo "excluded: ${filters:-none}"
          pnpm --workspace-concurrency=1 -r $filters run build:png --wait-until networkidle

      - name: Visual regression
        run: pnpm run vrt

      - name: Upload the diff report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-report
          path: |
            playwright-report/
            test-results/
