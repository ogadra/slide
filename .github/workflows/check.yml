name: Check

on:
  pull_request:

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Nothing here runs a browser or a bundler, so the postinstall scripts —
      # the Chromium download above all — are dead weight.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm --filter slide-home run lint

      - name: Typecheck scripts
        run: pnpm run typecheck

      # Only the key names reach the generated types, so the sample is enough.
      - name: Provide the .dev.vars keys
        run: cp .dev.vars.sample .dev.vars

      # Generates the gitignored manifest and Worker types first.
      - name: Typecheck the homepage
        run: pnpm --filter slide-home run typecheck

  # Its own job so a type error and a failing test show up as two findings, not one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Keeps its scripts for workerd, skips Chromium, which only the PNG export needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The Worker imports the generated manifest, so `test` generates it first.
      - name: Test
        run: pnpm run test

  # Nothing built a deck on a pull request, so slidev and vite bumps only failed in Deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Same two steps as Deploy, so this job fails on whatever would fail there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The Worker bundle imports the manifest.
      - name: Generate the slide manifest
        run: pnpm run generate

      # Every deck, because a bump reaches every deck. All 21 build in under 20 seconds.
      - name: Build every deck
        run: pnpm -r --workspace-concurrency=2 run build:slidev

      # The expensive half and its own failure mode, so the smallest deck runs it.
      - name: Export one deck to PNG
        run: pnpm --filter terraform-github-management run build:png

      # What Deploy ships, bundled for real and without credentials.
      - name: Bundle the Worker
        run: pnpm exec wrangler deploy --dry-run --env=""
