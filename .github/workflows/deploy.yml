name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      # Builds every deck, mirrors dist/ into R2, then ships the Worker. The
      # sync has to land before the deploy so the Worker never serves a page
      # that R2 does not have yet.
      - name: Build, sync and deploy
        run: pnpm run deploy:prd
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID_PRD: ${{ secrets.R2_ACCESS_KEY_ID_PRD }}
          R2_SECRET_ACCESS_KEY_PRD: ${{ secrets.R2_SECRET_ACCESS_KEY_PRD }}
