version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      # These two ship the same Chromium, so one pull request has to carry both.
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright-chromium"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * *"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
